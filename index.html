<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<title>Música</title>
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Música">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#fff;--bg2:#f5f5f7;--tx:#1d1d1f;--tx2:#86868b;--ln:#e5e5ea;--ac:#fa233b;--side:#f2f2f4;--glass:rgba(255,255,255,.82)}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--bg2:#2c2c2e;--tx:#f5f5f7;--tx2:#98989d;--ln:#3a3a3c;--side:#161618;--glass:rgba(44,44,46,.82)}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:1em;height:1em;fill:currentColor;display:block}
#app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:68px 1fr;grid-template-areas:"side top" "side main";height:100%}
#side{grid-area:side;background:var(--side);border-right:1px solid var(--ln);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:600;color:var(--ac);padding:0 8px 14px}
.logo svg{font-size:24px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:15px;text-align:left}
.nav svg{font-size:20px;color:var(--ac)}
.nav.on{background:rgba(128,128,128,.18)}
.sec{font-size:12px;font-weight:600;color:var(--tx2);padding:16px 10px 4px}
#top{grid-area:top;display:flex;align-items:center;gap:18px;padding:0 22px;border-bottom:1px solid var(--ln);background:var(--bg2)}
.ctl{display:flex;align-items:center;gap:14px;font-size:20px}
.ctl .big{font-size:30px}.ctl .sm{font-size:17px;color:var(--tx2)}.ctl .sm.on{color:var(--ac)}
.disp{flex:1;max-width:560px;margin:0 auto;height:60px;border-radius:8px;background:var(--bg);border:1px solid var(--ln);display:flex;flex-direction:column;justify-content:center;gap:3px;padding:4px 10px;overflow:hidden}
.disp .r1{display:flex;align-items:center;gap:10px;min-width:0}
.tl{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--tx2);font-variant-numeric:tabular-nums}
.tl span{min-width:32px}.tl span:last-child{text-align:right}
.tl input{flex:1;height:4px;cursor:pointer}
.tl input::-webkit-slider-thumb{width:9px;height:9px}
.tl input::-moz-range-thumb{width:9px;height:9px}
.disp .art{width:36px;height:36px;border-radius:4px;flex:none}
.meta{flex:1;min-width:0;text-align:center}
.meta b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{display:block;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disp .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--ac);width:0}
.vol{display:flex;align-items:center;gap:8px;width:130px;color:var(--tx2);font-size:18px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--tx2) var(--p,0%),var(--ln) var(--p,0%));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--tx)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--tx)}
#main{grid-area:main;overflow-y:auto;padding:28px 32px 40px}
h1{font-size:30px;font-weight:700;letter-spacing:-.4px;margin-bottom:18px}
h2{font-size:20px;font-weight:700;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
.card{text-align:left;min-width:0}
.card .art{width:100%;aspect-ratio:1;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.18);position:relative;margin-bottom:8px}
.card b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{display:block;font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art{display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);font-size:20px}
.card .art{font-size:40px}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;width:100%;text-align:left}
.row:nth-child(odd){background:var(--bg2)}
.row:hover{background:rgba(128,128,128,.16)}
.row .art{width:40px;height:40px;border-radius:5px;flex:none}
.row .meta{text-align:left}
.row .meta b{font-size:15px}
.row.cur .meta b{color:var(--ac)}
.row .hb{font-size:18px;color:var(--tx2);flex:none;padding:6px}
.row .hb.on{color:var(--ac)}
.row .dur{color:var(--tx2);font-size:13px;flex:none;min-width:36px;text-align:right}
.q{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--bg2);color:var(--tx);font:inherit;margin-bottom:16px}
.empty{text-align:center;color:var(--tx2);padding:50px 10px;line-height:1.5}
.btn{background:var(--ac);color:#fff;border-radius:8px;padding:9px 16px;font-weight:600;margin-top:10px}
.btn.alt{background:var(--bg2);color:var(--tx);border:1px solid var(--ln)}
.form{max-width:560px;display:grid;gap:8px}
.form label{font-size:13px;color:var(--tx2);margin-top:8px}
.form small{color:var(--tx2);line-height:1.5}
#msg{color:var(--ac);font-size:13px;min-height:18px}
.ib{font-size:20px;color:var(--tx2);padding:6px}.ib:hover{color:var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:90%}
#toast.on{opacity:1}
#mini,#tabs,#sheet{display:none}
@media(max-width:860px){
#app{grid-template-columns:1fr;grid-template-rows:1fr;grid-template-areas:"main"}
#side,#top{display:none}
#main{padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(150px + env(safe-area-inset-bottom,0px))}
h1{font-size:28px}
.grid{grid-template-columns:repeat(2,1fr);gap:16px}
#tabs{display:flex;position:fixed;left:0;right:0;bottom:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--ln);z-index:5}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--tx2);padding:4px 0}
#tabs button svg{font-size:24px}
#tabs button.on{color:var(--ac)}
#mini{display:flex;align-items:center;gap:12px;position:fixed;left:8px;right:8px;bottom:calc(62px + env(safe-area-inset-bottom,0px));padding:8px 12px;border-radius:14px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:6;cursor:pointer}
#mini .art{width:42px;height:42px;border-radius:6px;flex:none}
#mini .meta{text-align:left}
#mini .meta b{font-size:15px}
#mini button{font-size:24px;padding:4px}
}
#sheet{position:fixed;inset:0;z-index:10;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 28px calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);background:var(--bg)}
#sheet.open{transform:none}
@media(max-width:860px){#sheet{display:flex}}
@media(prefers-reduced-motion:reduce){#sheet{transition:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--tx2);opacity:.5;margin-bottom:22px;flex:none}
#sheet .art{width:min(100%,360px);aspect-ratio:1;border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.35);font-size:90px;margin:auto 0 22px;flex:none}
#sheet .info{width:100%;max-width:360px}
#sheet .info b{display:block;font-size:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheet .info span{display:block;font-size:19px;color:var(--ac);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{display:flex;justify-content:space-between;font-size:11px;color:var(--tx2);margin-top:6px}
#sheet .seekw{width:100%;max-width:360px;margin-top:18px}
#sheet .ctl{margin:12px 0;gap:30px;font-size:28px}
#sheet .ctl .big{font-size:48px}
#sheet .vol{width:100%;max-width:360px;margin-bottom:auto}
#sheet .vol input{flex:1}
</style>
</head>
<body>

</defs></svg>

<div id="app">
  <aside id="side">
    <div class="logo"><svg><use href="#i-note"/></svg>Música</div>
    <button class="nav" data-v="home"><svg><use href="#i-home"/></svg>Ouvir agora</button>
    <button class="nav" data-v="search"><svg><use href="#i-find"/></svg>Pesquisar</button>
    <div class="sec">Biblioteca</div>
    <button class="nav" data-v="lib"><svg><use href="#i-lib"/></svg>Músicas</button>
    <button class="nav" data-v="fav"><svg><use href="#i-heart"/></svg>Favoritas</button>
    <button class="nav" data-v="imp"><svg><use href="#i-dl"/></svg>Importar lista</button>
    <div class="sec">Conta</div>
    <button class="nav" data-v="set"><svg><use href="#i-set"/></svg>Google Drive</button>
  </aside>

  <header id="top">
    <div class="ctl">
      <button class="sm" id="shuf" aria-label="Aleatório"><svg><use href="#i-shuf"/></svg></button>
      <button data-a="prev" aria-label="Anterior"><svg><use href="#i-prev"/></svg></button>
      <button class="big" data-a="play" aria-label="Reproduzir"><svg><use class="pp" href="#i-play"/></svg></button>

    </div>
    <div class="disp"><div class="r1"><div class="art" id="tArt"><svg><use href="#i-note"/></svg></div>
      <div class="meta"><b id="tT">Sem música</b><span id="tA">Liga o Google Drive em Definições</span></div></div>
      <div class="tl"><span id="tCur">0:00</span><input type="range" id="tSeek" min="0" max="1000" value="0" aria-label="Linha do tempo"><span id="tDur">-0:00</span></div></div>
    <button class="ib" data-d aria-label="Transferir" title="Transferir"><svg><use href="#i-dl"/></svg></button>

  </header>

</div>

<div id="mini"><div class="art" id="mArt"><svg><use href="#i-note"/></svg></div>
  <div class="meta"><b id="mT">Sem música</b><span id="mA"></span></div>
  <button data-a="play" aria-label="Reproduzir"><svg><use class="pp" href="#i-play"/></svg></button>
  <button data-a="next" aria-label="Seguinte"><svg><use href="#i-next"/></svg></button></div>

<nav id="tabs">
  <button data-v="home"><svg><use href="#i-home"/></svg>Ouvir agora</button>
  <button data-v="lib"><svg><use href="#i-lib"/></svg>Biblioteca</button>
  <button data-v="fav"><svg><use href="#i-heart"/></svg>Favoritas</button>
  <button data-v="search"><svg><use href="#i-find"/></svg>Pesquisar</button>
  <button data-v="set"><svg><use href="#i-set"/></svg>Drive</button>
</nav>

<section id="sheet">
  <button class="grab" id="close" aria-label="Fechar"></button>
  <div class="art" id="sArt"><svg><use href="#i-note"/></svg></div>
  <div class="info"><b id="sT">Sem música</b><span id="sA"></span></div>
  <div class="seekw"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Progresso"><div class="tm"><span id="cur">0:00</span><span id="dur">0:00</span></div></div>
  <div class="ctl">
    <button class="sm" id="shuf2" aria-label="Aleatório"><svg><use href="#i-shuf"/></svg></button>

</section>
<div id="toast"></div>
<audio id="au" preload="metadata"></audio>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let cfg=st.get('cfg',{key:'',folder:''}),manual=st.get('manual',[]),favs=new Set(st.get('favs',[]));
let base=[],drive=st.get('drive',[]),songs=[],queue=[],qi=-1,shuffle=false,repeat=0,view='home',cur=null,msg='';
const au=$('#au');

const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const bg=s=>{const h=hue(s);return`linear-gradient(135deg,hsl(${h} 75% 62%),hsl(${(h+50)%360} 70% 42%))`};
function parse(f){const n=f.name.replace(/\.[a-z0-9]{2,4}$/i,'').replace(/_/g,' ');const p=n.split(' - ');
  return{id:f.id,title:(p.length>1?p.slice(1).join(' - '):n).trim(),artist:(p.length>1?p[0]:'Google Drive').trim()}}
const url=s=>cfg.key?`https://www.googleapis.com/drive/v3/files/${s.id}?alt=media&key=${encodeURIComponent(cfg.key)}`:`https://drive.google.com/uc?export=download&id=${s.id}`;
const fid=s=>{s=s.trim();let m=s.match(/\/d\/([\w-]{15,})/)||s.match(/folders\/([\w-]{15,})/)||s.match(/[?&]id=([\w-]{15,})/);return m?m[1]:s};
function build(){songs=[...drive,...manual].sort((a,b)=>a.title.localeCompare(b.title,'pt'))}

let lastSync=0,busy=false;
const sig=a=>a.map(x=>x.id+x.title+x.artist).sort().join('|');
function refresh(){if(view==='set')return;if(view==='search'){const q=$('#q');if(q)q.dispatchEvent(new Event('input'));return}render()}
async function sync(silent){
  if(!cfg.key||!cfg.folder){if(!silent){msg='Preenche a chave de API e a pasta.';render()}return}
  if(busy)return;busy=true;
  if(!silent){msg='A sincronizar…';render()}
  try{let all=[],tok='';
    do{const q=encodeURIComponent(`'${cfg.folder}' in parents and trashed=false`);
      const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=nextPageToken,files(id,name,mimeType)&pageSize=1000&key=${encodeURIComponent(cfg.key)}${tok?'&pageToken='+tok:''}`);
      const j=await r.json();if(j.error)throw new Error(j.error.message);
      all=all.concat(j.files||[]);tok=j.nextPageToken||''}while(tok);
    const nd=all.filter(f=>/^audio\//.test(f.mimeType)||/\.(mp3|m4a|aac|wav|flac|ogg|opus)$/i.test(f.name)).map(parse);
    const changed=sig(nd)!==sig(drive);
    if(changed){drive=nd;st.set('drive',drive);build()}
    lastSync=Date.now();
    if(!silent)msg=drive.length+' músicas encontradas.';
    else if(changed){toast('Biblioteca atualizada · '+drive.length+' músicas');refresh()}}
  catch(e){if(!silent)msg='Erro: '+e.message}
  busy=false;if(!silent)render()}

function rowH(s,i){const on=cur&&cur.id===s.id;
  return`<div class="row${on?' cur':''}" data-i="${i}" role="button" tabindex="0"><div class="art" style="background:${bg(s.title)}"><svg><use href="#i-note"/></svg></div>
  <div class="meta"><b>${esc(s.title)}</b><span>${esc(s.artist)}</span></div>
  <button class="hb" data-d="${s.id}" aria-label="Transferir"><svg><use href="#i-dl"/></svg></button><button class="hb${favs.has(s.id)?' on':''}" data-f="${s.id}" aria-label="Favorita"><svg><use href="#i-heart"/></svg></button></div>`}
function list(arr){return arr.length?arr.map((s,i)=>rowH(s,i)).join(''):'<div class="empty">Nada para mostrar.</div>'}
function empty(){return`<div class="empty">A tua biblioteca está vazia.<br>Liga a tua pasta do Google Drive para ouvir as tuas músicas.<br><button class="btn" data-v="set">Abrir definições</button></div>`}

let shown=[];
function render(){
  $$('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view&&b.classList.contains('nav')||b.dataset.v===view&&b.closest('#tabs')));
  const h=$('#h'),c=$('#c');
  if(view==='home'){h.textContent='Ouvir agora';shown=songs;
    c.innerHTML=songs.length?`<h2 style="margin-top:0">Adicionadas recentemente</h2><div class="grid">${songs.slice(0,24).map((s,i)=>`<button class="card" data-i="${i}"><div class="art" style="background:${bg(s.title)}"><svg width="40" height="40"><use href="#i-note"/></svg></div><b>${esc(s.title)}</b><span>${esc(s.artist)}</span></button>`).join('')}</div>`:empty()}
  else if(view==='lib'){h.textContent='Músicas';shown=songs;c.innerHTML=(cfg.key?'<button class="btn alt" id="rf" style="margin:0 0 12px">Atualizar</button>':'')+(songs.length?list(songs):empty());const rf=$('#rf');if(rf)rf.onclick=async()=>{toast('A atualizar…');await sync(true);toast('Biblioteca atualizada · '+songs.length+' músicas')}}
  else if(view==='fav'){h.textContent='Favoritas';shown=songs.filter(s=>favs.has(s.id));c.innerHTML='<button class="btn alt" data-v="imp" style="margin:0 0 12px">Importar lista do Apple Music</button>'+list(shown)}
  else if(view==='imp'){h.textContent='Importar lista';
    c.innerHTML=`<div class="form"><small>Na app Música (Mac), abre a playlist, seleciona tudo (Cmd+A), copia (Cmd+C) e cola abaixo, ou escolhe o ficheiro exportado (.txt ou .rtf). Também aceita uma música por linha como «Artista - Título». Só ficam como favoritas as músicas que existirem no teu Drive.</small>
    <input type="file" id="if" accept=".txt,.rtf,.tsv,.csv,text/*" class="q" style="margin:0">
    <textarea id="it" class="q" rows="6" placeholder="Ou cola aqui a lista" style="margin:0;resize:vertical"></textarea>
    <button class="btn" id="go">Importar para as favoritas</button>
    <button class="btn alt" id="yt" style="margin-top:0">Gerar ficheiro com links do YouTube</button><div id="msg">${esc(msg)}</div><div id="irep"></div></div>`;
    $('#if').onchange=async e=>{const f=e.target.files[0];if(f)$('#it').value=await readF(f)};
    $('#go').onclick=()=>doImport($('#it').value);
    $('#yt').onclick=()=>{const tr=parseList($('#it').value);if(!tr.length){$('#msg').textContent='Escolhe um ficheiro ou cola a lista primeiro.';return}
      saveCsv(tr,'favoritas_youtube.csv');$('#msg').textContent=tr.length+' links gerados. O ficheiro abre no Excel, Numbers ou Folhas de cálculo.'}}
  else if(view==='search'){h.textContent='Pesquisar';
    c.innerHTML='<input class="q" id="q" type="search" placeholder="Músicas, artistas" autocomplete="off"><div id="res"></div>';
    $('#q').oninput=e=>{const t=e.target.value.toLowerCase();shown=songs.filter(s=>(s.title+' '+s.artist).toLowerCase().includes(t));$('#res').innerHTML=t?list(shown):''}}
  else if(view==='set'){h.textContent='Google Drive';
    c.innerHTML=`<div class="form"><small>1. Cria uma chave de API (Google Cloud Console, com a Drive API ativa).<br>2. Coloca as músicas numa pasta e partilha-a como «Qualquer pessoa com a ligação».<br>3. Cola abaixo a chave e a ligação da pasta.</small>
    <label>Chave de API</label><input class="q" id="k" value="${esc(cfg.key)}" autocomplete="off" style="margin:0">
    <label>Ligação ou ID da pasta</label><input class="q" id="f" value="${esc(cfg.folder)}" autocomplete="off" style="margin:0">
    <button class="btn" id="sv">Guardar e sincronizar</button>
    <label style="margin-top:22px">Ou adiciona uma música avulsa (ligação do ficheiro)</label>
    <input class="q" id="ml" placeholder="https://drive.google.com/file/d/…" style="margin:0"><input class="q" id="mn" placeholder="Artista - Título" style="margin:0">
    <button class="btn alt" id="ad">Adicionar música</button><div id="msg">${esc(msg)}</div>
    ${manual.length?'<button class="btn alt" id="cl">Remover músicas avulsas</button>':''}</div>`;
    $('#sv').onclick=()=>{cfg={key:$('#k').value.trim(),folder:fid($('#f').value)};st.set('cfg',cfg);sync()};
    $('#ad').onclick=()=>{const id=fid($('#ml').value);if(id.length<15){msg='Ligação inválida.';return render()}
      manual.push(parse({id,name:$('#mn').value.trim()||'Música '+(manual.length+1)}));st.set('manual',manual);build();msg='Música adicionada.';render()};
    if($('#cl'))$('#cl').onclick=()=>{manual=[];st.set('manual',manual);build();msg='';render()}}
}

async function readF(f){const b=await f.arrayBuffer(),u=new Uint8Array(b);
  if(u[0]===255&&u[1]===254)return new TextDecoder('utf-16le').decode(b);
  if(u[0]===254&&u[1]===255)return new TextDecoder('utf-16be').decode(b);
  return new TextDecoder('utf-8').decode(b)}
function rtf(t){const i=t.indexOf('\\cf0 ');t=t.slice(i>=0?i+5:0);
  return t.replace(/\\\r?\n/g,'\n').replace(/\\par\b ?/g,'\n').replace(/\\'([0-9a-f]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16)))
    .replace(/\\u(-?\d+)\??/g,(m,n)=>String.fromCharCode(n<0?+n+65536:+n)).replace(/\\tab ?/g,'\t').replace(/\\[a-z]+-?\d* ?/g,'').replace(/[{}]/g,'')}
const norm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[\(\[][^\)\]]*[\)\]]/g,' ').replace(/[^a-z0-9]+/g,' ').trim();
function parseList(raw){
  if(/^\{\\rtf/.test(raw.trim()))raw=rtf(raw);
  const out=[];let hdr=null;
  for(const line of raw.split(/\r\n|\n|\r/)){const l=line.replace(/\u0000/g,'');if(!l.trim())continue;
    if(l.includes('\t')){const c=l.split('\t').map(x=>x.trim());
      if(/^(nome|name|título|titulo|title)$/i.test(c[0])&&c.some(x=>/^(artista|artist)$/i.test(x))){hdr=c;continue}
      if(hdr){const a=hdr.findIndex(x=>/^(artista|artist)$/i.test(x));out.push({title:c[0],artist:a>-1?c[a]||'':''});continue}
      const ti=c.findIndex((x,i)=>i>0&&/^\d{1,2}:\d{2}(:\d{2})?$/.test(x));
      out.push({title:c[0],artist:ti>0?c[ti+1]||'':c[1]||''})}
    else{const m=l.split(' - ');out.push(m.length>1?{artist:m[0].trim(),title:m.slice(1).join(' - ').trim()}:{title:l.trim(),artist:''})}}
  return out.filter(t=>t.title)}
function matchList(tr){
  const idx=songs.map(s=>({s,h:norm(s.artist==='Google Drive'?s.title:s.artist+' '+s.title)}));
  const ok=[],miss=[];
  for(const t of tr){const nt=norm(t.title),na=(t.artist||'').split(/,|&|\bfeat\b|\bx\b/i).map(norm).filter(x=>x.length>2);
    let best=null,bs=0;
    for(const {s,h} of idx){if(!nt||!h.includes(nt))continue;const sc=na.some(a=>h.includes(a))?3:2;if(sc>bs){bs=sc;best=s}}
    if(best&&(bs===3||nt.length>=6))ok.push(best);else miss.push(t)}
  return{ok,miss}}
const ytUrl=t=>'https://www.youtube.com/results?search_query='+encodeURIComponent(((t.artist||'').split(/,|&|\bfeat\b/i)[0].trim()+' '+t.title).trim()).replace(/%20/g,'+');
function saveCsv(rows,name){const q=v=>'"'+String(v||'').replace(/"/g,'""')+'"';
  const body=['Título,Artista,Link YouTube (pesquisa)',...rows.map(t=>[q(t.title),q(t.artist),q(ytUrl(t))].join(','))].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8'}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function doImport(raw){
  const m=$('#msg');
  if(!songs.length){m.textContent='A biblioteca está vazia. Liga primeiro o Drive em Google Drive.';return}
  const tr=parseList(raw);if(!tr.length){m.textContent='Não encontrei músicas no texto.';return}
  const {ok,miss}=matchList(tr);ok.forEach(s=>favs.add(s.id));st.set('favs',[...favs]);
  m.textContent=ok.length+' de '+tr.length+' músicas encontradas no Drive e marcadas como favoritas.';
  $('#irep').innerHTML=miss.length?'<h2>Não encontradas ('+miss.length+')</h2><small style="color:var(--tx2)">Carrega estes ficheiros para o Drive e volta a importar.</small>'+miss.map(t=>'<div class="row"><div class="meta"><b>'+esc(t.title)+'</b><span>'+esc(t.artist||'')+'</span></div></div>').join('')+'<button class="btn alt" id="ym" style="margin-top:12px">Links do YouTube das não encontradas</button>':'';
  const ym=$('#ym');if(ym)ym.onclick=()=>saveCsv(miss,'nao_encontradas_youtube.csv')}
function setArt(el,s){el.style.background=s?bg(s.title):'var(--bg2)'}
function ui(){
  const s=cur;
  ['t','m','s'].forEach(p=>{const T=$('#'+p+'T'),A=$('#'+p+'A');T.textContent=s?s.title:'Sem música';A.textContent=s?s.artist:(p==='t'?'Liga o Google Drive em Definições':'')});
  ['tArt','mArt','sArt'].forEach(i=>setArt($('#'+i),s));
  const icon=au.paused?'#i-play':'#i-pause';$$('.pp').forEach(u=>u.setAttribute('href',icon));
  $$('#shuf,#shuf2').forEach(b=>b.classList.toggle('on',shuffle));
  $$('#rep,#rep2').forEach(b=>{b.classList.toggle('on',repeat>0);b.style.opacity=repeat===2?1:''});
  $$('#rep,#rep2').forEach(b=>b.title=['Repetir: desativado','Repetir tudo','Repetir uma'][repeat]);
  $$('.row').forEach(r=>{const x=shown[r.dataset.i];r.classList.toggle('cur',!!(x&&cur&&x.id===cur.id))});
  if(s)document.title=s.title+' · Música'}

function play(i,from){
  if(from)shown=from;
  const arr=shown.length?shown:songs;if(!arr.length)return;
  base=arr.slice();queue=arr.slice();if(shuffle){const c=arr[i];queue=arr.filter((_,k)=>k!==i).sort(()=>Math.random()-.5);queue.unshift(c);qi=0}else qi=i;
  load()}
function load(){cur=queue[qi];au.src=url(cur);au.play().catch(()=>{});ui();media()}
function nav(d){if(!queue.length)return;let n=qi+d;
  if(n>=queue.length){if(repeat===1||d>0&&repeat===0&&false)n=0;else if(repeat===1)n=0;else return au.pause()}
  if(n<0)n=0;qi=n;load()}
function toggle(){if(!cur){if(songs.length){shown=songs;play(0)}return}au.paused?au.play():au.pause()}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
async function dl(s){if(!s)return toast('Escolhe primeiro uma música');
  toast('A transferir «'+s.title+'»…');
  try{const r=await fetch(url(s));if(!r.ok)throw 0;const b=await r.blob();
    const m=(b.type.split('/')[1]||'mpeg'),ext=/mpeg/.test(m)?'mp3':/mp4|m4a|aac/.test(m)?'m4a':/wav/.test(m)?'wav':/flac/.test(m)?'flac':/ogg|opus/.test(m)?'ogg':'mp3';
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(s.artist==='Google Drive'?'':s.artist+' - ')+s.title+'.'+ext;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Transferência concluída')}
  catch{window.open('https://drive.google.com/uc?export=download&id='+s.id,'_blank')}}
function media(){if(!('mediaSession'in navigator)||!cur)return;
  navigator.mediaSession.metadata=new MediaMetadata({title:cur.title,artist:cur.artist});
  navigator.mediaSession.setActionHandler('play',()=>au.play());navigator.mediaSession.setActionHandler('pause',()=>au.pause());
  navigator.mediaSession.setActionHandler('nexttrack',()=>nav(1));navigator.mediaSession.setActionHandler('previoustrack',()=>nav(-1));
  const h=(n,f)=>{try{navigator.mediaSession.setActionHandler(n,f)}catch{}};
  h('seekbackward',d=>skip(-(d.seekOffset||10)));h('seekforward',d=>skip(d.seekOffset||10));
  h('seekto',d=>{if(au.duration&&d.seekTime!=null)au.currentTime=d.seekTime})}

au.onplay=au.onpause=ui;
au.onended=()=>{if(repeat===2){au.currentTime=0;au.play()}else nav(1)};
au.onerror=()=>{if(cur){$('#tA').textContent='Não foi possível reproduzir. Verifica a partilha e a chave.'}};
function tick(){const d=au.duration,t=au.currentTime,p=d?t/d:0;
  ['#seek','#tSeek'].forEach(i=>{const k=$(i);if(!k.dataset.d){k.value=p*1000;k.style.setProperty('--p',p*100+'%')}});
  $('#cur').textContent=$('#tCur').textContent=fmt(t);$('#dur').textContent=fmt(d);$('#tDur').textContent=d?'-'+fmt(d-t):'-0:00';
  if('mediaSession'in navigator&&d&&navigator.mediaSession.setPositionState)try{navigator.mediaSession.setPositionState({duration:d,position:Math.min(t,d),playbackRate:au.playbackRate||1})}catch{}}
au.ontimeupdate=tick;au.onloadedmetadata=tick;
function skip(dt){if(au.duration)au.currentTime=Math.max(0,Math.min(au.duration,au.currentTime+dt))}
['#seek','#tSeek'].forEach(i=>{const k=$(i);
  k.oninput=()=>{k.dataset.d=1;const v=k.value/1000;k.style.setProperty('--p',v*100+'%');
    if(au.duration){$('#cur').textContent=$('#tCur').textContent=fmt(v*au.duration);$('#tDur').textContent='-'+fmt(au.duration*(1-v))}};
  k.onchange=()=>{if(au.duration)au.currentTime=k.value/1000*au.duration;delete k.dataset.d};
  k.onpointerup=()=>k.blur()});
function setVol(v){au.volume=v;['#vol','#vol2'].forEach(i=>{$(i).value=v;$(i).style.setProperty('--p',v*100+'%')})}
$('#vol').oninput=e=>setVol(+e.target.value);$('#vol2').oninput=e=>setVol(+e.target.value);setVol(.8);

document.addEventListener('click',e=>{
  const v=e.target.closest('[data-v]');if(v){view=v.dataset.v;render();$('#main').scrollTop=0;return}
  const a=e.target.closest('[data-a]');if(a){e.stopPropagation();const x=a.dataset.a;x==='play'?toggle():nav(x==='next'?1:-1);return}
  const d=e.target.closest('[data-d]');if(d){e.stopPropagation();const id=d.dataset.d||(cur&&cur.id);dl(songs.find(x=>x.id===id));return}
  const f=e.target.closest('[data-f]');if(f){const id=f.dataset.f;favs.has(id)?favs.delete(id):favs.add(id);st.set('favs',[...favs]);if(view==='fav')shown=songs.filter(s=>favs.has(s.id));f.classList.toggle('on');if(view==='fav')render();return}
  const r=e.target.closest('[data-i]');if(r){play(+r.dataset.i);return}
  if(e.target.closest('#mini'))$('#sheet').classList.add('open')});
$('#close').onclick=()=>$('#sheet').classList.remove('open');
document.addEventListener('keydown',e=>{if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&!/INPUT/.test(e.target.tagName)){e.preventDefault();skip(e.key==='ArrowRight'?10:-10)}
  if(e.key==='Enter'&&e.target.classList.contains('row'))play(+e.target.dataset.i);
  if(e.code==='Space'&&!/INPUT|BUTTON/.test(e.target.tagName)){e.preventDefault();toggle()}});
$$('#shuf,#shuf2').forEach(b=>b.onclick=()=>{shuffle=!shuffle;
  if(cur&&base.length){if(shuffle){queue=[cur,...base.filter(x=>x.id!==cur.id).sort(()=>Math.random()-.5)];qi=0}else{queue=base.slice();qi=Math.max(0,queue.findIndex(x=>x.id===cur.id))}}
  toast(shuffle?'Aleatório ativado':'Aleatório desativado');ui()});
$$('#rep,#rep2').forEach(b=>b.onclick=()=>{repeat=(repeat+1)%3;toast(['Repetir: desativado','Repetir tudo','Repetir uma música'][repeat]);ui()});

build();render();ui();
if(cfg.key&&cfg.folder)sync(drive.length>0);
setInterval(()=>{if(document.visibilityState==='visible')sync(true)},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastSync>15000)sync(true)});
</script>
</body>
</html>
